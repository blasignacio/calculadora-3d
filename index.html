<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Costos 3D</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .results {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 2px dashed var(--border-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .result-row.total {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
        }

        .status-message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            display: none;
        }

        .status-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de Impresión 3D</h1>
    
    <form id="calcForm" onsubmit="return false;">
        <div class="form-group">
            <label for="nombrePieza">Nombre del Trabajo / Pieza</label>
            <input type="text" id="nombrePieza" placeholder="Ej. Soporte para Auriculares" required>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="pesoGramos">Peso Utilizado (g)</label>
                <input type="number" id="pesoGramos" step="any" placeholder="50" required>
            </div>
            <div class="form-group">
                <label for="costoKilo">Costo del Filamento ($/kg)</label>
                <input type="number" id="costoKilo" step="any" placeholder="20000" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="tiempoHoras">Tiempo de Impresión (hs)</label>
                <input type="number" id="tiempoHoras" step="any" placeholder="2.5" required>
            </div>
            <div class="form-group">
                <label for="consumoW">Consumo Impresora (Watts)</label>
                <input type="number" id="consumoW" step="any" value="150" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="costoKwh">Costo Energía ($/kWh)</label>
                <input type="number" id="costoKwh" step="any" value="100" required>
            </div>
            <div class="form-group">
                <label for="depreciacionHora">Desgaste/Máquina ($/h)</label>
                <input type="number" id="depreciacionHora" step="any" value="150" required>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="margenGanancia">Margen de Ganancia (%)</label>
                <input type="number" id="margenGanancia" step="any" value="100" required>
            </div>
            <div class="form-group">
                <label for="fallaPorcentaje">Margen de Error/Falla (%)</label>
                <input type="number" id="fallaPorcentaje" step="any" value="10" required>
            </div>
        </div>

        <button type="button" id="btnCalcular">Calcular y Registrar</button>
    </form>

    <div class="results" id="resultsBlock">
        <div class="result-row">
            <span>Costo de Material:</span>
            <span id="resMaterial">$0.00</span>
        </div>
        <div class="result-row">
            <span>Costo de Energía:</span>
            <span id="resEnergia">$0.00</span>
        </div>
        <div class="result-row">
            <span>Desgaste de Máquina:</span>
            <span id="resDepreciacion">$0.00</span>
        </div>
        <div class="result-row">
            <span>Costo Base Total:</span>
            <span id="resCostoBase">$0.00</span>
        </div>
        <div class="result-row total">
            <span>Precio de Venta Sugerido:</span>
            <span id="resPrecioVenta">$0.00</span>
        </div>
    </div>

    <div id="statusMessage" class="status-message"></div>
</div>

<script>
    // Coloca aquí la URL de tu Web App de Google Apps Script si quieres guardar los datos en Google Sheets
    var APPS_SCRIPT_URL = "";

    function mostrarEstado(mensaje, esExito) {
        var el = document.getElementById('statusMessage');
        if (!el) return;
        el.innerText = mensaje;
        el.className = "status-message " + (esExito ? "status-success" : "status-error");
        el.style.display = "block";
    }

    function procesarCalculo() {
        var nombre = document.getElementById('nombrePieza').value;
        var peso = parseFloat(document.getElementById('pesoGramos').value) || 0;
        var costoKilo = parseFloat(document.getElementById('costoKilo').value) || 0;
        var tiempo = parseFloat(document.getElementById('tiempoHoras').value) || 0;
        var consumoW = parseFloat(document.getElementById('consumoW').value) || 0;
        var costoKwh = parseFloat(document.getElementById('costoKwh').value) || 0;
        var depreciacion = parseFloat(document.getElementById('depreciacionHora').value) || 0;
        var margen = parseFloat(document.getElementById('margenGanancia').value) || 0;
        var falla = parseFloat(document.getElementById('fallaPorcentaje').value) || 0;

        if (!nombre || peso <= 0 || tiempo <= 0) {
            mostrarEstado("Por favor ingresa un nombre, peso y tiempo válidos.", false);
            return;
        }

        // Cálculos
        var costoMaterial = (peso / 1000) * costoKilo;
        var costoEnergia = (tiempo * (consumoW / 1000)) * costoKwh;
        var costoDesgaste = tiempo * depreciacion;
        
        var costoBase = costoMaterial + costoEnergia + costoDesgaste;
        costoBase += costoBase * (falla / 100);

        var precioVenta = costoBase * (1 + (margen / 100));

        // Renderizado
        document.getElementById('resMaterial').innerText = "$" + costoMaterial.toFixed(2);
        document.getElementById('resEnergia').innerText = "$" + costoEnergia.toFixed(2);
        document.getElementById('resDepreciacion').innerText = "$" + costoDesgaste.toFixed(2);
        document.getElementById('resCostoBase').innerText = "$" + costoBase.toFixed(2);
        document.getElementById('resPrecioVenta').innerText = "$" + precioVenta.toFixed(2);

        // Envío a Google Apps Script
        if (APPS_SCRIPT_URL && APPS_SCRIPT_URL.trim() !== "") {
            mostrarEstado("Enviando registro a Google Sheets...", true);
            
            var datos = {
                fecha: new Date().toLocaleString(),
                nombre: nombre,
                pesoGramos: peso,
                tiempoHoras: tiempo,
                costoBase: costoBase.toFixed(2),
                precioVenta: precioVenta.toFixed(2)
            };

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            })
            .then(function() {
                mostrarEstado("¡Registro guardado con éxito!", true);
            })
            .catch(function(error) {
                console.error("Error al registrar:", error);
                mostrarEstado("Error de conexión al enviar los datos.", false);
            });
        } else {
            mostrarEstado("Cálculo realizado con éxito.", true);
        }
    }

    // Event Listener seguro cuando el DOM está listo
    document.addEventListener("DOMContentLoaded", function() {
        var btn = document.getElementById('btnCalcular');
        if (btn) {
            btn.addEventListener('click', procesarCalculo);
        }
    });
</script>

</body>
</html>

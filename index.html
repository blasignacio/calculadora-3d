<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Impresión 3D</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-main {
            width: 100%;
            background-color: #2563eb;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-main:hover {
            background-color: #1d4ed8;
        }

        .results {
            margin-top: 20px;
            border-top: 2px dashed #e5e7eb;
            padding-top: 15px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #4b5563;
        }

        .total {
            font-weight: bold;
            color: #2563eb;
            font-size: 1.2rem;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
            margin-top: 10px;
        }

        .status-box {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .status-success {
            background-color: #d1fae5;
            color: #065f46;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora de Impresión 3D</h1>
    
    <div class="form-group">
        <label>Nombre de la Pieza / Trabajo</label>
        <input type="text" id="nombrePieza" placeholder="Ej. Soporte Auriculares">
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Peso Utilizado (g)</label>
            <input type="number" id="pesoGramos" placeholder="50">
        </div>
        <div class="form-group">
            <label>Costo Filamento ($/kg)</label>
            <input type="number" id="costoKilo" placeholder="20000">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Tiempo (Horas)</label>
            <input type="number" id="tiempoHoras" placeholder="2.5">
        </div>
        <div class="form-group">
            <label>Consumo (Watts)</label>
            <input type="number" id="consumoW" value="150">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Costo Energía ($/kWh)</label>
            <input type="number" id="costoKwh" value="100">
        </div>
        <div class="form-group">
            <label>Desgaste Máquina ($/h)</label>
            <input type="number" id="depreciacionHora" value="150">
        </div>
    </div>

    <div class="grid-2">
        <div class="form-group">
            <label>Margen Ganancia (%)</label>
            <input type="number" id="margenGanancia" value="100">
        </div>
        <div class="form-group">
            <label>Margen Error/Falla (%)</label>
            <input type="number" id="fallaPorcentaje" value="10">
        </div>
    </div>

    <button class="btn-main" onclick="calcularYGuardar()">Calcular y Guardar en Registro</button>

    <div class="results">
        <div class="result-row">
            <span>Costo Material:</span>
            <span id="resMaterial">$0.00</span>
        </div>
        <div class="result-row">
            <span>Costo Energía:</span>
            <span id="resEnergia">$0.00</span>
        </div>
        <div class="result-row">
            <span>Desgaste Máquina:</span>
            <span id="resDepreciacion">$0.00</span>
        </div>
        <div class="result-row">
            <span>Costo Base Total:</span>
            <span id="resCostoBase">$0.00</span>
        </div>
        <div class="result-row total">
            <span>Precio Venta Sugerido:</span>
            <span id="resPrecioVenta">$0.00</span>
        </div>
    </div>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    // URL de tu Web App en Google Apps Script
    // Si tienes el enlace de Google Apps Script colócalo dentro de las comillas.
    var WEB_APP_URL = "";

    function mostrarEstado(mensaje, esExito) {
        var box = document.getElementById('statusBox');
        box.innerText = mensaje;
        box.className = "status-box " + (esExito ? "status-success" : "status-error");
        box.style.display = "block";
    }

    function calcularYGuardar() {
        var nombre = document.getElementById('nombrePieza').value;
        var peso = parseFloat(document.getElementById('pesoGramos').value) || 0;
        var costoKilo = parseFloat(document.getElementById('costoKilo').value) || 0;
        var tiempo = parseFloat(document.getElementById('tiempoHoras').value) || 0;
        var consumoW = parseFloat(document.getElementById('consumoW').value) || 0;
        var costoKwh = parseFloat(document.getElementById('costoKwh').value) || 0;
        var depreciacion = parseFloat(document.getElementById('depreciacionHora').value) || 0;
        var margen = parseFloat(document.getElementById('margenGanancia').value) || 0;
        var falla = parseFloat(document.getElementById('fallaPorcentaje').value) || 0;

        if (!nombre || peso <= 0 || tiempo <= 0) {
            mostrarEstado("Por favor ingresa un nombre, peso y tiempo válidos.", false);
            return;
        }

        // 1. Cálculos de costos
        var costoMaterial = (peso / 1000) * costoKilo;
        var costoEnergia = (tiempo * (consumoW / 1000)) * costoKwh;
        var costoDesgaste = tiempo * depreciacion;
        
        var costoBase = costoMaterial + costoEnergia + costoDesgaste;
        costoBase += costoBase * (falla / 100); // Sumar margen de error

        var precioVenta = costoBase * (1 + (margen / 100));

        // 2. Mostrar los resultados en la interfaz
        document.getElementById('resMaterial').innerText = "$" + costoMaterial.toFixed(2);
        document.getElementById('resEnergia').innerText = "$" + costoEnergia.toFixed(2);
        document.getElementById('resDepreciacion').innerText = "$" + costoDesgaste.toFixed(2);
        document.getElementById('resCostoBase').innerText = "$" + costoBase.toFixed(2);
        document.getElementById('resPrecioVenta').innerText = "$" + precioVenta.toFixed(2);

        // 3. Envío y Guardado de datos a Google Sheets
        if (WEB_APP_URL && WEB_APP_URL.trim() !== "") {
            mostrarEstado("Guardando registro en Google Sheets...", true);

            var paqueteDatos = {
                fecha: new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString(),
                nombre: nombre,
                pesoGramos: peso,
                tiempoHoras: tiempo,
                costoBase: costoBase.toFixed(2),
                precioVenta: precioVenta.toFixed(2)
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(paqueteDatos)
            })
            .then(function() {
                mostrarEstado("¡Cálculo realizado y guardado con éxito!", true);
            })
            .catch(function(err) {
                console.error(err);
                mostrarEstado("Cálculo realizado, pero falló el envío a Google Sheets.", false);
            });
        } else {
            mostrarEstado("Cálculo realizado con éxito. (Nota: Para guardar en Google Sheets debes poner tu URL en WEB_APP_URL)", true);
        }
    }
</script>

</body>
</html>
